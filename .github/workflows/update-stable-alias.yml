name: Update stable ontology aliases

on:
  push:
    branches:
     # - gh-pages
     - fix/pid-resolution
    paths:
      - 'releases/**/*.ttl'
      - 'releases/**/*.html'

jobs:
  update-alias:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update stable aliases to latest release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Collect release directories, e.g. releases/golem_v1-1/, releases/golem_v2-0/
          release_dirs=(releases/*/)

          if [ ${#release_dirs[@]} -eq 0 ]; then
            echo "ERROR: No release directories found under releases/"
            exit 1
          fi

          # Pick the latest release directory (version-aware sort)
          latest_dir=$(printf "%s\n" "${release_dirs[@]}" | sort -V | tail -n 1)
          latest_dir="${latest_dir%/}"
          echo "Latest release directory: $latest_dir"

          # Find its ttl/html, excluding backups (e.g. .ttl.bak)
          latest_ttl=$(find "$latest_dir" -maxdepth 1 -type f -name '*.ttl' | sort -V | tail -n 1)
          latest_html=$(find "$latest_dir" -maxdepth 1 -type f -name '*.html' | sort -V | tail -n 1)

          if [ -z "$latest_ttl" ]; then
            echo "ERROR: No .ttl file found in $latest_dir"
            exit 1
          fi
          if [ -z "$latest_html" ]; then
            echo "ERROR: No .html file found in $latest_dir"
            exit 1
          fi

          echo "Latest TTL:  $latest_ttl"
          echo "Latest HTML: $latest_html"

          cp "$latest_ttl" golem.ttl
          cp "$latest_html" golem.html

      - name: Commit updated aliases
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add golem.ttl golem.html
          git commit -m "Auto-update stable ontology aliases" || echo "No changes to commit"
          git push