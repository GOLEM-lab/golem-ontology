name: Publish GOLEM release

on:
  push:
    branches:
      - main
    paths:
      - 'releases/**/*.ttl'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ------------------------------------------------------------
      # 2. Identify the release TTL that triggered the workflow
      # ------------------------------------------------------------

      - name: Identify changed release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Workflow manually triggered."

            # For a manual run, use the newest release directory.
            release_dirs=(releases/*/)

            if [ ${#release_dirs[@]} -eq 0 ]; then
              echo "ERROR: No release directories found under releases/"
              exit 1
            fi

            latest_dir=$(printf "%s\n" "${release_dirs[@]}" | sort -V | tail -n 1)
            latest_dir="${latest_dir%/}"

            ttl_files=("$latest_dir"/*.ttl)

            if [ ${#ttl_files[@]} -eq 0 ]; then
              echo "ERROR: No TTL file found in $latest_dir"
              exit 1
            fi

            if [ ${#ttl_files[@]} -gt 1 ]; then
              echo "ERROR: More than one TTL file found in $latest_dir:"
              printf '  %s\n' "${ttl_files[@]}"
              exit 1
            fi

            ttl_file="${ttl_files[0]}"

          else
            echo "Workflow triggered by push."

            before="${{ github.event.before }}"
            after="${{ github.event.after }}"

            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              echo "First push of this branch detected."

              mapfile -t ttl_files < <(
                git ls-tree -r --name-only "$after" |
                grep '^releases/[^/]*/[^/]*\.ttl$' || true
              )

            else
              echo "Comparing:"
              echo "  before: $before"
              echo "  after: $after"

              mapfile -t ttl_files < <(
                git diff --name-only "$before" "$after" |
                grep '^releases/[^/]*/[^/]*\.ttl$' || true
              )
            fi

            if [ ${#ttl_files[@]} -eq 0 ]; then
              echo "ERROR: No changed release TTL found."
              exit 1
            fi

            if [ ${#ttl_files[@]} -gt 1 ]; then
              echo "ERROR: More than one release TTL changed in this push:"
              printf '  %s\n' "${ttl_files[@]}"
              echo
              echo "Please publish one release TTL at a time."
              exit 1
            fi

            ttl_file="${ttl_files[0]}"
          fi

          release_dir=$(dirname "$ttl_file")
          ttl_filename=$(basename "$ttl_file")

          echo "Release directory: $release_dir"
          echo "TTL file:          $ttl_filename"

          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
          echo "ttl_file=$ttl_file" >> "$GITHUB_OUTPUT"
          echo "ttl_filename=$ttl_filename" >> "$GITHUB_OUTPUT"


      # ------------------------------------------------------------
      # 3. Generate RDF/XML and JSON-LD serializations
      # ------------------------------------------------------------

      - name: Generate RDF serializations
        shell: bash
        run: |
          set -euo pipefail

          ttl_filename="${{ steps.release.outputs.ttl_filename }}"

          ./scripts/serializer/build.sh "$ttl_filename"


      # ------------------------------------------------------------
      # 4. Set up Python for PyLODE
      #
      # PyLODE is installed directly rather than through the
      # pylode-to-pages GitHub Action.
      #
      # The version is pinned to avoid incompatible dependency
      # changes in future releases.
      # ------------------------------------------------------------

      - name: Set up Python for PyLODE
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyLODE
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install "pylode==3.2.1"

          echo "Installed PyLODE version:"
          pylode --version


      # ------------------------------------------------------------
      # 5. Generate PyLODE documentation
      # ------------------------------------------------------------

      - name: Generate PyLODE documentation
        shell: bash
        run: |
          set -euo pipefail

          release_dir="${{ steps.release.outputs.release_dir }}"
          ttl_filename="${{ steps.release.outputs.ttl_filename }}"
          ttl_file="${{ steps.release.outputs.ttl_file }}"

          ontology_name="${ttl_filename%.ttl}"
          html_file="$release_dir/$ontology_name.html"

          echo "Generating PyLODE documentation:"
          echo "  TTL:  $ttl_file"
          echo "  HTML: $html_file"

          pylode "$ttl_file" -o "$html_file"

          if [ ! -f "$html_file" ]; then
            echo "ERROR: PyLODE did not generate $html_file"
            exit 1
          fi

          echo "Generated:"
          ls -lh "$html_file"


      # ------------------------------------------------------------
      # 6. Clean PyLODE auxiliary output
      # ------------------------------------------------------------

      - name: Clean PyLODE auxiliary output
        shell: bash
        run: |
          set -euo pipefail

          release_dir="${{ steps.release.outputs.release_dir }}"
          ttl_filename="${{ steps.release.outputs.ttl_filename }}"

          ontology_name="${ttl_filename%.ttl}"

          # Remove PyLODE backup of the source TTL, if generated.
          rm -f "$release_dir"/*.ttl.bak

          # Remove nested duplicate documentation directory, if generated.
          rm -rf "$release_dir/$ontology_name"

          # Remove PyLODE-generated release index, if generated.
          rm -f "$release_dir/index.html"


      # ------------------------------------------------------------
      # 7. Determine the newest release
      # ------------------------------------------------------------

      - name: Find latest release
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          release_dirs=(releases/*/)

          if [ ${#release_dirs[@]} -eq 0 ]; then
            echo "ERROR: No release directories found under releases/"
            exit 1
          fi

          latest_dir=$(printf "%s\n" "${release_dirs[@]}" | sort -V | tail -n 1)
          latest_dir="${latest_dir%/}"

          echo "Latest release directory: $latest_dir"

          echo "latest_dir=$latest_dir" >> "$GITHUB_OUTPUT"


      # ------------------------------------------------------------
      # 8. Update stable aliases
      # ------------------------------------------------------------

      - name: Update stable aliases
        shell: bash
        run: |
          set -euo pipefail

          latest_dir="${{ steps.latest.outputs.latest_dir }}"

          latest_ttl=$(find "$latest_dir" -maxdepth 1 -type f -name '*.ttl' | sort -V | tail -n 1)
          latest_owl=$(find "$latest_dir" -maxdepth 1 -type f -name '*.owl' | sort -V | tail -n 1)
          latest_jsonld=$(find "$latest_dir" -maxdepth 1 -type f -name '*.jsonld' | sort -V | tail -n 1)
          latest_html=$(find "$latest_dir" -maxdepth 1 -type f -name '*.html' | sort -V | tail -n 1)

          if [ -z "$latest_ttl" ]; then
            echo "ERROR: No .ttl file found in $latest_dir"
            exit 1
          fi

          if [ -z "$latest_owl" ]; then
            echo "ERROR: No .owl file found in $latest_dir"
            exit 1
          fi

          if [ -z "$latest_jsonld" ]; then
            echo "ERROR: No .jsonld file found in $latest_dir"
            exit 1
          fi

          if [ -z "$latest_html" ]; then
            echo "ERROR: No .html file found in $latest_dir"
            exit 1
          fi

          echo "Latest TTL:      $latest_ttl"
          echo "Latest OWL:      $latest_owl"
          echo "Latest JSON-LD:  $latest_jsonld"
          echo "Latest HTML:     $latest_html"

          mkdir -p current

          cp "$latest_ttl" current/golem.ttl
          cp "$latest_owl" current/golem.owl
          cp "$latest_jsonld" current/golem.jsonld
          cp "$latest_html" current/golem.html


      # ------------------------------------------------------------
      # 9. Commit generated release artifacts
      # ------------------------------------------------------------

      - name: Commit generated release artifacts
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add releases/ current/

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Publish GOLEM release"
            git push origin HEAD:main
          fi


      # ------------------------------------------------------------
      # 10. Checkout gh-pages separately
      # ------------------------------------------------------------

      - name: Checkout gh-pages for deployment
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-deploy
          fetch-depth: 0


      # ------------------------------------------------------------
      # 11. Synchronize published ontology files
      #
      # Replace only current/ and releases/ on gh-pages.
      # Preserve index.html, CNAME, .nojekyll, stylesheets,
      # and any other website-specific files.
      # ------------------------------------------------------------

      - name: Synchronize ontology files to gh-pages
        shell: bash
        run: |
          set -euo pipefail

          deploy_dir="$GITHUB_WORKSPACE/gh-pages-deploy"

          echo "Removing previously published ontology directories..."
          rm -rf "$deploy_dir/current" "$deploy_dir/releases"

          echo "Copying current ontology aliases..."
          cp -a "$GITHUB_WORKSPACE/current" "$deploy_dir/current"

          echo "Copying versioned ontology releases..."
          cp -a "$GITHUB_WORKSPACE/releases" "$deploy_dir/releases"

          echo "Files to publish:"
          find "$deploy_dir/current" "$deploy_dir/releases" \
            -maxdepth 4 -type f | sort

          echo "Verifying website files are preserved..."
          test -f "$deploy_dir/index.html"
          test -f "$deploy_dir/CNAME"

          echo "Website files remain in place."


      # ------------------------------------------------------------
      # 12. Commit and push the deployment
      # ------------------------------------------------------------

      - name: Commit and push gh-pages updates
        shell: bash
        run: |
          set -euo pipefail

          deploy_dir="$GITHUB_WORKSPACE/gh-pages-deploy"

          git -C "$deploy_dir" config \
            user.name "github-actions[bot]"

          git -C "$deploy_dir" config \
            user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git -C "$deploy_dir" add -- current releases

          if git -C "$deploy_dir" diff --cached --quiet; then
            echo "No changes to published ontology files."
          else
            git -C "$deploy_dir" commit \
              -m "Deploy GOLEM ontology artifacts"

            git -C "$deploy_dir" push origin HEAD:gh-pages
          fi
